     <h1>Blotter / Incident Records</h1>
    <input type="text" id="complainant" placeholder="Complainant">
    <input type="text" id="respondent" placeholder="Respondent">
    <input type="text" id="victim" placeholder="Victim">
    
    <select id="incident_type">
      <option value="">-- Select Concern Type (Optional) --</option>
      <option value="Peace & Order Concerns">Peace & Order Concerns</option>
      <option value="Mediation / Legal Concerns">Mediation / Legal Concerns</option>
      <option value="Health & Social Services Concerns">Health & Social Services Concerns</option>
      <option value="Environmental Concerns">Environmental Concerns</option>
      <option value="Infrastructure & Public Works">Infrastructure & Public Works Disturbance</option>
        <option value="Community / Youth Concerns">Community / Youth Concerns</option>
      <option value="Others">Others</option>
    </select>
      
    
    <textarea id="incident_details" placeholder="Incident Details / Narrative (Long Comment, Optional)" rows="4"></textarea> 

    <input type="text" id="location" placeholder="Location of Respondent">
    <input type="date" id="date">
    <input type="time" id="time">
  
    <button onclick="addBlotter()">Submit</button>
</div>

   <script>
    // Function to get the current blotter records from local storage
    function getBlotters() {
        const blotters = localStorage.getItem('blotterRecords');
        return blotters ? JSON.parse(blotters) : [];
    }

    // Function to save the updated blotter records to local storage
    function saveBlotters(blotters) {
        localStorage.setItem('blotterRecords', JSON.stringify(blotters));
    }

    function addBlotter() {
        // 1. Get values from the input fields
        const complainant = document.getElementById('complainant').value.trim();
        const respondent = document.getElementById('respondent').value.trim();
        const victim = document.getElementById('victim').value.trim();
        
        // Kinuha ang IDs
        const incidentType = document.getElementById('incident_type').value.trim(); 
        const incidentDetails = document.getElementById('incident_details').value; 
        
        const location = document.getElementById('location').value.trim();
        const date = document.getElementById('date').value.trim();
        const time = document.getElementById('time').value.trim();
        // TINANGGAL ANG PAG-KUHA NG STATUS VALUE: const status = document.getElementById('status').value.trim(); 

        // Simple validation (Only Complainant and Date are required)
        if (!complainant || !date) {
            alert("Please fill in Complainant and Date. All other fields are optional.");
            return;
        }

        // 2. Create a new record object
        const newRecord = {
            complainant,
            respondent: respondent || 'N/A', 
            victim: victim || 'N/A',
            // OPTIONAL FIELDS
            incident: incidentType || 'Not Specified', // Incident Type is optional
            incidentDetails: incidentDetails,        // Long comment is optional
            
            location: location || 'N/A',
            date,
            time,
            status: 'Pending' // MANUAL STATUS: Lahat ng bagong record ay 'Pending' na ngayon
        };

        // 3. Get existing records, add the new one, and save
        const blotters = getBlotters();
        blotters.push(newRecord);
        saveBlotters(blotters);

        alert("Record added successfully! Status set to 'Pending'.");

        // 4. I-clear ang form pagkatapos mag-submit
        document.getElementById('complainant').value = '';
        document.getElementById('respondent').value = '';
        document.getElementById('victim').value = '';
        document.getElementById('incident_type').value = '';
        document.getElementById('incident_details').value = ''; 
        document.getElementById('location').value = '';
        document.getElementById('date').value = '';
        document.getElementById('time').value = '';
    }
</script>
