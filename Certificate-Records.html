 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Certificate Issuance - Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
       :root {
            /* HD Background Color Scheme */
            --bg-dark: #0f172a;      /* Very dark, near-black blue for max contrast */
            --bg-panel: #1e293b;     /* Dark slate blue for panels (lifts off the background) */
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;   /* Slightly darker muted text */
            --accent: #ffc93c; 
            --success: #1d9e75; 
            --warning: #ef4444; 
            --sidebar-width: 250px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            
            /* HD Background Layers: Dark Gradient Overlay + High-Res Image */
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), 
                url('https://picsum.photos/1920/1080?random=1&blur=2'); 
                
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* --- Sidebar & Main Content (Adjusted for Barangay feel) --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            /* Lighter, subtle border-right */
            border-right: 1px solid rgba(255,255,255,0.05);
            position: fixed;
            height: 100%;
            transition: var(--transition);
            z-index: 100;
            /* Added deep shadow */
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); 
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }
        .logo span { color: white; } /* Barangay Hall icon */

        .nav-links { list-style: none; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 10px;
            transition: var(--transition);
            font-size: 0.95rem;
        }
        .nav-links a span { margin-left: 10px; }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 201, 60, 0.15);
            color: var(--accent);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 30px;
            width: calc(100% - var(--sidebar-width));
        }
        header h1 { font-size: 2.2rem; }
        header p { color: var(--accent); font-weight: 600; }


        /* --- Form/Box Styles --- */
        .box {
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 16px;
            /* Increased shadow for better floating effect against the background */
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            margin-top: 20px;
            max-width: 800px;
        }
        .box h2 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 20px;
        }
        
        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: #1f375f; /* Darker input background */
            color: var(--text-main);
            font-size: 1rem;
        }
        
        /* Placeholder styling for dark theme */
        ::placeholder {
            color: var(--text-muted);
            opacity: 1; 
        }
        option {
            background-color: #1f375f;
            color: var(--text-main);
        }
        
        /* Submit Button */
        button {
            padding: 12px 25px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background: #17835f; 
        }

        /* --- Table Styling for Records --- */
        table {
            width: 100%;
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 20px;
            background: var(--bg-dark); /* Kept table background dark but semi-transparent */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        th, td {
            padding: 15px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background: var(--bg-panel);
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #234070; /* Slight hover effect */
        }
 /* =============================
    logout button
============================= */
.logout-btn {
  margin: 20px;
  padding: 12px;
  width: calc(100% - 40px);
  border: none;
  background: #c0392b;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  border-radius: 6px;
}

.logout-btn:hover {
  background: #a93226;
}
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <span class="material-icons-round">apartment</span>
            <span>Brgy.  Lambing</span>
        </div>
         <ul class="nav-links">
            <li><a href="admin.html" class="#"><span class="material-icons-round">summarize</span><span>Dashboard</span></a></li>
            <li><a href="resident1.html"><span class="material-icons-round">group</span><span>Residents List</span></a></li>
            <li><a href="blotterRecords.html"><span class="material-icons-round">gavel</span><span>Katarungang PB</span></a></li>
            <li><a href="tanodreport.html"><span class="material-icons-round">local_police</span><span>Tanod Reports</span></a></li>
            <li><a href="#"><span class="material-icons-round">receipt_long</span><span>Certificates</span></a></li>
        <button class="logout-btn" onclick="logout()">Logout</button>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <h1>Certificate Issuance Management</h1>
            
        </header>

        <div class="box">
            <h2>Recent Certificate Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Contact No.</th>
                        <th>Requester</th>
                        <th>Type</th>
                        <th>Purpose</th>
                        <th>Date Issued</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="certificateTableBody">
                    </tbody>
            </table>
        </div>


        <script>
            // --- Local Storage Management ---
            function getCertificates() {
                // TAMA: Kukunin ang Local Storage key na 'certificateReports'
                const reports = localStorage.getItem('certificateReports');
                return reports ? JSON.parse(reports) : [];
            }

            // --- Function to Load and Display Records ---
            function loadCertificateRecords() {
                const certificates = getCertificates();
                // TAMA: Ang table body ID ay 'certificateTableBody'
                const tableBody = document.getElementById('certificateTableBody'); 
                tableBody.innerHTML = ''; 

                const recentCertificates = certificates.slice(-10).reverse(); 

                if (recentCertificates.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No certificate records found.</td></tr>';
                    return;
                }

                recentCertificates.forEach(record => {
                    const row = tableBody.insertRow();
                    row.innerHTML = `
                        <td>${record.controlNumber}</td>
                        <td>${record.requesterName}</td>
                        <td>${record.certType}</td>
                        <td>${record.purpose}</td>
                        <td>${record.dateIssued}</td>
                        <td style="color: var(--success); font-weight: 600;">${record.status}</td>
                    `;
                });
            }

            // TAMA: Tiyakin na ang loadCertificateRecords function ang tatawagin sa pag-load ng page
            window.onload = loadCertificateRecords;
        </script>
        <script>
function logout() {
  // Clear login data (if any)
  localStorage.clear();
  sessionStorage.clear();

  // Redirect to login page
  window.location.href = "login1.html";
}
</script>
    </main>
</body>
</html>
