 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* =============================
   BACKGROUND SLIDESHOW
============================= */
.slideshow{
    position:fixed;
    inset:0;
    z-index:-1;
}

.slideshow img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    animation:fade 20s infinite;
}

.slideshow img:nth-child(1){animation-delay:0s;}
.slideshow img:nth-child(2){animation-delay:5s;}
.slideshow img:nth-child(3){animation-delay:10s;}
.slideshow img:nth-child(4){animation-delay:15s;}

@keyframes fade{
    0%{opacity:0;}
    10%{opacity:1;}
    30%{opacity:1;}
    40%{opacity:0;}
    100%{opacity:0;}
}

/* =============================
   FORM BOX
============================= */
.box{
    width:340px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.box h2{
    text-align:center;
    margin-bottom:20px;
}

.box input,
.box select,
.box button{
    width:100%;
    padding:10px;
    margin:8px 0;
}

.box button{
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.box button:hover{
    background:#0056b3;
}

.switch{
    text-align:center;
    margin-top:10px;
}

.switch a{
    color:#007bff;
    cursor:pointer;
    text-decoration:none;
}

#msg{
    color:red;
    text-align:center;
    margin-top:10px;
}

.hidden{ display:none; }
</style>
</head>

<body>

 <!-- =============================
     SLIDESHOW IMAGES
============================= -->
<div class="slideshow">
    <img src="file:///C:/Users/ADMIN/Downloads/597158155_869460002235397_1834324794221778936_n.jpg" alt="">
    <img src="file:///C:/Users/ADMIN/Downloads/597319802_1554615692402307_655421837137661427_n.jpg" alt="">
    <img src="file:///C:/Users/ADMIN/Downloads/597881480_1420134066365150_9219533480957788302_n.jpg" alt="">
    <img src="file:///C:/Users/ADMIN/Downloads/597116340_2792048161142478_5963129178445261312_n.jpg" alt="">
</div>

<!-- LOGIN FORM -->
<div class="box" id="loginBox">
    <h2>Login</h2>

    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">

    <select id="loginRole">
        <option value="user">User</option>
        <option value="admin">Administrator</option>
    </select>

    <button onclick="login()">Login</button>

    <div class="switch">
        No account? <a onclick="showRegister()">Register</a>
    </div>

    <p id="msg"></p>
</div>

<!-- REGISTER FORM -->
<div class="box hidden" id="registerBox">
    <h2>Register</h2>

    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">

    <select id="regRole">
        <option value="user">User</option>
        <option value="admin">Administrator</option>
    </select>

    <button onclick="register()">Register</button>

    <div class="switch">
        Already have account? <a onclick="showLogin()">Login</a>
    </div>
</div>

 <script>
/* =============================
   FORM SWITCH
============================= */
function showRegister(){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin(){
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

/* =============================
   REGISTER ACCOUNT (SAVE)
============================= */
function register(){
    const u = document.getElementById("regUser").value.trim();
    const p = document.getElementById("regPass").value.trim();
    const r = document.getElementById("regRole").value;

    if(!u || !p){
        alert("Please fill in all fields");
        return;
    }

    // Get existing users
    let users = JSON.parse(localStorage.getItem("users")) || {};

    // Check duplicate username
    if(users[u]){
        alert("Username already exists");
        return;
    }

    // Save new account
    users[u] = {
        password: p,
        role: r
    };

    localStorage.setItem("users", JSON.stringify(users));

    alert("Account created successfully!");
    document.getElementById("regUser").value = "";
    document.getElementById("regPass").value = "";
    showLogin();
}

/* =============================
   LOGIN
============================= */
function login(){
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPass").value.trim();
    const r = document.getElementById("loginRole").value;

    let users = JSON.parse(localStorage.getItem("users")) || {};

    // Default admin (optional)
    if(u === "admin" && p === "admin123" && r === "admin"){
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("role", "admin");
        location.href = "admin.html";
        return;
    }

    if(users[u] && users[u].password === p && users[u].role === r){
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("role", r);
        sessionStorage.setItem("username", u);

        location.href = r === "admin" ? "admin.html" : "home.html";
    } else {
        document.getElementById("msg").textContent = "Invalid username, password, or role";
    }
}
</script>


</body>
</html>
